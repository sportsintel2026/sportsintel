<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="google-site-verification" content="bjQvpO1A5bRHxxMAD4im9xCySVgsDE2IPOl_rTLSXmQ" />
    <meta name="description" content="WizePicks is temporarily offline while we work on the next version of the platform." />
    <title>WizePicks — Under Construction</title>

    <!-- WZ-SEO-META-2026-08-17 :: baseline global canonical + Open Graph + Twitter/X card.
         Static in the SPA shell; per-route self-canonical is a later SEO step. Canonical
         host is www.wizepicks.com, matching the apex->www 307 and /sitemap.xml. Title and
         description are unchanged and mirrored into og:/twitter: below. -->
    <link rel="canonical" href="https://www.wizepicks.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WizePicks" />
    <meta property="og:url" content="https://www.wizepicks.com/" />
    <meta property="og:title" content="WizePicks — Under Construction" />
    <meta property="og:description" content="WizePicks is temporarily offline while we work on the next version of the platform." />
    <meta property="og:image" content="https://www.wizepicks.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WizePicks — Under Construction" />
    <meta name="twitter:description" content="WizePicks is temporarily offline while we work on the next version of the platform." />
    <meta name="twitter:image" content="https://www.wizepicks.com/icon-512.png" />

    <!-- WZ-SEO-JSONLD-2026-08-17 :: global Organization + WebSite structured data (SEO step 5, B1).
         Truthful, verified fields only: brand name WizePicks, canonical www URL, and the real
         public logo asset (/icon-512.png, HTTP 200). No sameAs (no official social profile in the
         repo), no SearchAction (no public site search), no ratings/reviews. Static in the shell,
         so every prerendered route inherits this one block. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.wizepicks.com/#organization",
          "name": "WizePicks",
          "url": "https://www.wizepicks.com",
          "logo": "https://www.wizepicks.com/icon-512.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.wizepicks.com/#website",
          "name": "WizePicks",
          "url": "https://www.wizepicks.com",
          "publisher": { "@id": "https://www.wizepicks.com/#organization" }
        }
      ]
    }
    </script>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%231D9E75'/></svg>" />
    <style>
      body { margin: 0; background: #050505 !important; }
      /* Kill the Safari focus/tap outline that draws a ring around the
         scrollable sheet and other focusable elements on tap. Touch-first app. */
      * { -webkit-tap-highlight-color: transparent; }
      *:focus, *:focus-visible { outline: none !important; }
    </style>
  </head>
  <body>
    <div id="root"><main class="maintenance-page"><section class="maintenance-card" aria-labelledby="maintenance-title"><div class="maintenance-brand">WizePicks</div><div class="maintenance-rule" aria-hidden="true"></div><p class="maintenance-kicker">TEMPORARY MAINTENANCE</p><h1 id="maintenance-title">UNDER CONSTRUCTION</h1><p class="maintenance-message">We’re temporarily offline.<br />WizePicks is currently on hold while we work on the next version of the platform.<br />Thanks for checking in — we’ll be back.</p></section></main></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* Temporary maintenance mode: retire the previous offline app shell and its cached full site. */
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
          })
          .catch(function () {});
      }
      if ("caches" in window) {
        caches.keys()
          .then(function (keys) {
            return Promise.all(keys.filter(function (key) { return key.indexOf("wizepicks-") === 0; }).map(function (key) { return caches.delete(key); }));
          })
          .catch(function () {});
      }
    </script>
  </body>
</html>
