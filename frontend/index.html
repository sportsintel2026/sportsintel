<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="WizePicks — Live scores, H2H records, player stats, and weather analysis for MLB, NBA, and NFL." />
    <title>WizePicks — Your Edge on Every Game</title>

    <!-- WZ-SEO-META-2026-08-17 :: baseline global canonical + Open Graph + Twitter/X card.
         Static in the SPA shell; per-route self-canonical is a later SEO step. Canonical
         host is www.wizepicks.com, matching the apex->www 307 and /sitemap.xml. Title and
         description are unchanged and mirrored into og:/twitter: below. -->
    <link rel="canonical" href="https://www.wizepicks.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WizePicks" />
    <meta property="og:url" content="https://www.wizepicks.com/" />
    <meta property="og:title" content="WizePicks — Your Edge on Every Game" />
    <meta property="og:description" content="WizePicks — Live scores, H2H records, player stats, and weather analysis for MLB, NBA, and NFL." />
    <meta property="og:image" content="https://www.wizepicks.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WizePicks — Your Edge on Every Game" />
    <meta name="twitter:description" content="WizePicks — Live scores, H2H records, player stats, and weather analysis for MLB, NBA, and NFL." />
    <meta name="twitter:image" content="https://www.wizepicks.com/icon-512.png" />

    <!-- WZ-SEO-JSONLD-2026-08-17 :: global Organization + WebSite structured data (SEO step 5, B1).
         Truthful, verified fields only: brand name WizePicks, canonical www URL, and the real
         public logo asset (/icon-512.png, HTTP 200). No sameAs (no official social profile in the
         repo), no SearchAction (no public site search), no ratings/reviews. Static in the shell,
         so every prerendered route inherits this one block. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.wizepicks.com/#organization",
          "name": "WizePicks",
          "url": "https://www.wizepicks.com",
          "logo": "https://www.wizepicks.com/icon-512.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.wizepicks.com/#website",
          "name": "WizePicks",
          "url": "https://www.wizepicks.com",
          "publisher": { "@id": "https://www.wizepicks.com/#organization" }
        }
      ]
    }
    </script>

    <!-- WZ-PWA-SAFEBOTTOM-2026-07-05 :: re-enable viewport-fit=cover so the sport bar's
         existing env(safe-area-inset-bottom) padding works in the installed app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WizePicks" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%231D9E75'/></svg>" />
    <style>
      body { margin: 0; background: #20201E !important; }
      /* Kill the Safari focus/tap outline that draws a ring around the
         scrollable sheet and other focusable elements on tap. Touch-first app. */
      * { -webkit-tap-highlight-color: transparent; }
      *:focus, *:focus-visible { outline: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* WZ-PWA-SAFEBOTTOM-2026-07-05 :: register the service worker (offline shell; live /api is never cached) */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
